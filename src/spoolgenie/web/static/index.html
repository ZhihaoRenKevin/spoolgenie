<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" id="metaThemeColor" content="#0a0b1a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SpoolGenie" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <title>SpoolGenie — 线盘神灯 · Wish on a Spool, Print in Reality</title>
  <link rel="stylesheet" href="/static/styles.css?v=12" />
  <script>
    (function () {
      const saved = localStorage.getItem('sg_theme');
      const theme = saved || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      const m = document.getElementById('metaThemeColor');
      if (m) m.setAttribute('content', theme === 'dark' ? '#0a0b1a' : '#faf6ee');
    })();
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- AMBIENT MAGICAL AURORA & STARDUST BACKDROP -->
  <div class="magic-backdrop" aria-hidden="true">
    <div class="aurora aurora-gold"></div>
    <div class="aurora aurora-violet"></div>
    <div class="aurora aurora-teal"></div>
    <div class="stardust"></div>
  </div>
  <div id="sparkleLayer" class="sparkle-layer" aria-hidden="true"></div>

  <!-- MINIMAL MAGICAL TOPBAR -->
  <header class="topbar">
    <div class="top-left">
      <div class="brand-wrap">
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="10.5" cy="13.5" r="7"/>
            <circle cx="10.5" cy="13.5" r="2.3"/>
            <path d="M16.2 8.5 C18.5 6.8 18.8 5.1 17.6 3.8"/>
            <path d="M18.2 1.8 L19.1 4.2 L21.5 5.1 L19.1 6 L18.2 8.4 L17.3 6 L14.9 5.1 L17.3 4.2 Z" fill="#fff7d6" stroke="none"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">SpoolGenie <span class="ver-tag" data-i18n="brand_tag">线盘神灯</span></div>
        </div>
      </div>

      <select id="projectSwitcher" class="project-select" title="Switch wish project"></select>
      <button id="newProjectBtn" class="icon-pill pill-gold" data-i18n="new_btn" title="Start a new wish">✨ 新许愿</button>
    </div>

    <div class="top-right">
      <button id="openMwDrawerBtn" class="icon-pill" data-i18n="mw_btn" title="Search MakerWorld">🔎 MakerWorld</button>
      <button id="mobilePairBtn" class="icon-pill" data-i18n="mobile_btn" title="Connect phone via QR">📱 手机</button>
      <button id="themeToggleBtn" class="icon-pill" title="Toggle Midnight / Sunlit theme">☀️ 晨光浅色</button>
      <button id="langToggleBtn" class="icon-pill" title="Switch language / 切换中英文">EN</button>
      <span id="hwBadge" class="hw-pill">…</span>
    </div>
  </header>

  <!-- CHAT-FIRST CENTERED WISH SANCTUARY -->
  <main class="chat-shell">
    <div id="chatScroll" class="chat-scroll">
      <div id="chatStream" class="chat-stream"></div>
    </div>

    <!-- FLOATING ENCHANTED COMPOSER BAR -->
    <div class="composer-dock">
      <div id="attachedStrip" class="attached-strip hidden"></div>
      <form id="chatForm" class="composer-box">
        <textarea
          id="chatInput"
          rows="1"
          placeholder="对着神灯说出你的 3D 打印愿望…（Enter 许愿，支持 Ctrl+V 粘贴参考图）"
        ></textarea>
        <div class="composer-actions">
          <div class="composer-left-tools">
            <label class="tool-chip" title="Upload reference image / STL / 3MF">
              <span data-i18n="attach_ref">📎 参考图/STL</span>
              <input id="refUpload" type="file" accept=".png,.jpg,.jpeg,.webp,.stl,.3mf,.glb,.obj" hidden />
            </label>
            <button id="composerMwBtn" type="button" class="tool-chip" data-i18n="mw_chip">🔎 找 MakerWorld 灵感</button>
            <label class="auto2d-check" title="Automatically conjure 2D vision after replying">
              <input id="auto2dCheck" type="checkbox" checked />
              <span data-i18n="auto_2d">自动显化 2D 幻象</span>
            </label>
          </div>
          <div class="composer-right-tools">
            <span id="statusInline" class="status-inline"></span>
            <button id="sendBtn" type="submit" class="btn btn-magic" data-i18n="send_btn">✨ 许下愿望</button>
          </div>
        </div>
      </form>
    </div>
  </main>

  <!-- SLIDE-OVER MAKERWORLD SEARCH DRAWER -->
  <div id="mwDrawerBackdrop" class="drawer-backdrop hidden">
    <aside class="drawer-panel" role="dialog" aria-modal="true" aria-label="MakerWorld Search">
      <div class="drawer-head">
        <strong data-i18n="mw_drawer_title">🔎 MakerWorld 灵感宝库搜索</strong>
        <button id="closeMwDrawerBtn" type="button" class="modal-close" aria-label="Close">×</button>
      </div>
      <div class="drawer-body">
        <div class="panel-note" data-i18n="mw_note">搜索公开 MakerWorld 模型并一键带入许愿对话，或粘贴模型链接提取结构与色盘。</div>
        <div class="row">
          <input id="mwQuery" type="text" placeholder="搜索 MakerWorld（如 wall-e, gridfinity, headphone stand…）" />
          <button id="mwSearchBtn" type="button" class="btn btn-magic" data-i18n="search_btn">搜索</button>
        </div>
        <div id="mwQuickTags" class="chip-row"></div>
        <div id="mwResults" class="mw-results"></div>
        <div class="divider"></div>
        <div class="micro-label" data-i18n="mw_url_label">粘贴 MakerWorld 模型链接</div>
        <div class="row">
          <input id="mwUrlInput" type="text" placeholder="https://makerworld.com/en/models/..." />
          <button id="mwUrlBtn" type="button" class="btn btn-secondary" data-i18n="import_btn">导入</button>
        </div>
        <div class="micro-label" data-i18n="attached_label">当前已施法绑定参考</div>
        <div id="attachedRefsDrawer" class="mw-attached"></div>
      </div>
    </aside>
  </div>

  <!-- MOBILE / LAN QR PAIRING MODAL -->
  <div id="mobileModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="mobileModalTitle">
    <div class="modal-card">
      <div class="modal-head">
        <strong id="mobileModalTitle" data-i18n="modal_mobile_title">📱 手机 App / 同 Wi-Fi 扫码直连</strong>
        <button id="closeMobileModalBtn" type="button" class="modal-close" aria-label="Close">×</button>
      </div>
      <div class="modal-body">
        <div id="lanStatusPill" class="lan-pill">检测局域网状态…</div>
        <div id="lanQrBox" class="qr-box"></div>
        <div class="row">
          <input id="lanUrlInput" type="text" readonly class="mono" />
          <button id="copyLanUrlBtn" type="button" class="btn btn-magic" data-i18n="copy_btn">复制</button>
        </div>
        <div id="lanHintBox" class="panel-note"></div>
        <div class="mobile-guide">
          <div><strong data-i18n="guide_ios_t">🍎 iOS:</strong> <span data-i18n="guide_ios_d">Safari 扫码打开 → 分享 →「添加到主屏幕」，全屏运行。</span></div>
          <div><strong data-i18n="guide_and_t">🤖 Android:</strong> <span data-i18n="guide_and_d">Chrome 扫码打开 → 菜单 →「安装应用 / 添加到主屏幕」。</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX MODAL -->
  <div id="lightboxModal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="lightbox-inner">
      <button id="closeLightboxBtn" type="button" class="lightbox-close" aria-label="Close">×</button>
      <img id="lightboxImg" src="" alt="Preview" />
      <div id="lightboxCap" class="lightbox-cap"></div>
    </div>
  </div>

  <script type="module" src="/static/app.js?v=12"></script>
</body>
</html>
